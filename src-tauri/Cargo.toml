[package]
name = "jarvis-desktop"
version = "0.1.0"
description = "JARVIS Desktop Assistant Tauri Shell"
authors = ["JARVIS Engineering Team"]
edition = "2021"

[lib]
name = "jarvis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

